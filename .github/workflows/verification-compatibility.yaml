name: Verification Compatibility tests

on:
  workflow_call:
    inputs:
      sdkImage:
        description: "sdk image, will use 'ghcr.io/restatedev/test-services-node:main' when unspecified"
        required: false
        default: "ghcr.io/restatedev/test-services-node:main"
        type: string
      mode:
        type: string
        description: "compatibility test mode (forward: from old to new version, backward: from new to old version, random: back and forth between versions)"
        required: false
        default: "forward"
      releasedImage:
        description: "released restate image to use as the compatibility base (upgraded to/from ghcr.io/restatedev/restate:main)"
        required: true
        type: string
      restateLogFilter:
        description: "RESTATE_LOG_FILTER for the runtime nodes (e.g. restate=info)"
        required: false
        default: "restate=info"
        type: string
  workflow_dispatch: # To start from UI
    inputs:
      sdkImage:
        description: "sdk image, will use 'ghcr.io/restatedev/test-services-node:main' when unspecified"
        required: false
        default: "ghcr.io/restatedev/test-services-node:main"
        type: string
      mode:
        type: choice
        description: "compatibility test mode (forward: from old to new version, backward: from new to old version, random: back and forth between versions)"
        options:
          - forward
          - backward
          - random
      releasedImage:
        description: "released restate image to use as the compatibility base (upgraded to/from ghcr.io/restatedev/restate:main)"
        required: false
        default: "restatedev/restate:1.6.2"
        type: string
      restateLogFilter:
        description: "RESTATE_LOG_FILTER for the runtime nodes (e.g. restate=info)"
        required: false
        default: "restate=info"
        type: string

env:
  REPOSITORY_OWNER: ${{ github.repository_owner }}
  GHCR_REGISTRY: "ghcr.io"
  GHCR_REGISTRY_USERNAME: ${{ github.actor }}
  GHCR_REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Compatibility tests (${{ inputs.mode }}, ${{ inputs.releasedImage }} <-> main)
    # prevent running on forks
    if: github.repository_owner == 'restatedev'
    runs-on: warp-ubuntu-latest-x64-16x # warpbuild runner
    timeout-minutes: 250
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log into GitHub container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ env.GHCR_REGISTRY_USERNAME }}
          password: ${{ env.GHCR_REGISTRY_TOKEN }}

      - name: Run the verification test
        env:
          RESTATE_CONTAINER_IMAGE: "ghcr.io/restatedev/restate:main"
          RESTATE_RELEASED_CONTAINER_IMAGE: ${{ inputs.releasedImage }}
          SERVICES_CONTAINER_IMAGE: ${{ inputs.sdkImage }}
          ENV_FILE: "compatibility/env.json"
          PARAMS_FILE: "compatibility/params.json"
          MODE: ${{ inputs.mode }}
          RESTATE_LOG_FILTER: ${{ inputs.restateLogFilter || 'restate=info' }}
        run: ./scripts/run-verification.sh

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-compatibility-log
          path: logs/
          retention-days: 14
