apiVersion: chaos-mesh.org/v1alpha1
kind: Schedule
metadata:
  name: experiment
  namespace: ${NS}
spec:
  schedule: "@every 60s"
  concurrencyPolicy: Forbid
  # Enough retained children for the default five-minute window.
  historyLimit: 10
  type: PodChaos
  podChaos:
    action: pod-kill
    mode: one
    gracePeriod: 0
    selector:
      namespaces:
        - ${NS}
      labelSelectors:
        app.kubernetes.io/name: restate
